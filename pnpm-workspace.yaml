packages:
  - examples
pmOnFail: error
allowBuilds:
  # Removes macOS's quarantine attribute from dawn.node; nothing on Linux.
  webgpu: true
  # Fetches the runtime for `alchemy dev`, which deploys don't use.
  workerd: false
minimumReleaseAgeExclude:
  - "@schnau/tsconfig"
  # Vite+ 1.8.0 came out on 2026-11-24 between 02:15 and 03:15 UTC, inside pnpm's one-day
  # minimumReleaseAge, which pnpm 12 also applies to the lockfile. Delete these entries after
  # 2026-11-25 03:16 UTC.
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
catalog:
  # Exactly the tsrs that Vite+ bundles, so the lint's type check, the build and the tests run one
  # compiler.
  tsrs: 7.1.0-beta.tsrs4
  # Vite+ bundles Vite as its core. Every package and plugin resolves that one copy.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
overrides:
  vite@*: "catalog:"
